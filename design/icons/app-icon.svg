<!--
  Ikona aplikacji (iOS, Android maskable): pełny kwadrat bez przezroczystości i bez zaokrągleń —
  system sam przycina rogi. Znak mieści się w strefie bezpiecznej (koło 80% szerokości).
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#283143"/>
      <stop offset="1" stop-color="#141922"/>
    </linearGradient>
    <!-- delikatny wątek muru: rzędy cegieł z przesunięciem co drugi rząd -->
    <pattern id="bond" width="256" height="128" patternUnits="userSpaceOnUse">
      <path d="M0 0.5h256M0 64.5h256M128 0v64M0 64v64M256 64v64" stroke="#FFFFFF" stroke-opacity=".035" stroke-width="3" fill="none"/>
    </pattern>
    <radialGradient id="glow" cx=".5" cy=".42" r=".55">
      <stop offset="0" stop-color="#E07A5F" stop-opacity=".22"/>
      <stop offset="1" stop-color="#E07A5F" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1024" height="1024" fill="url(#bg)"/>
  <rect width="1024" height="1024" fill="url(#bond)"/>
  <rect width="1024" height="1024" fill="url(#glow)"/>
  <g transform="translate(512 526) scale(14.5) translate(-24 -26)">
    <path d="M6 20 24 6l18 14" fill="none" stroke="#E07A5F" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="9" y="24" width="17" height="6" rx="2" fill="#FFFFFF"/>
    <rect x="17" y="32" width="18" height="6" rx="2" fill="#E07A5F"/>
    <rect x="25" y="40" width="14" height="6" rx="2" fill="#F2A93B"/>
  </g>
</svg>
